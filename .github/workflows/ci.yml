name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # WPF only builds on Windows.
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Verify and package release
        shell: pwsh
        run: ./scripts/Build-Release.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/releases/**/TestResults/*.trx

      - name: Upload verified packages
        uses: actions/upload-artifact@v7
        with:
          name: transportorders-release
          path: |
            artifacts/releases/**/*.zip
            artifacts/releases/**/manifest.json
          if-no-files-found: error
